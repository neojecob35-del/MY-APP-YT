name: Build ShortsBot APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip if present
        run: |
          Z=$(find . -maxdepth 2 -iname "*.zip" | head -1)
          echo "zip: $Z"
          if [ -n "$Z" ]; then unzip -qo "$Z"; fi
          find . -name settings.gradle | head
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: |
          D=$(dirname "$(find . -name settings.gradle | head -1)")
          cd "$D"
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ShortsBot-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
