name: Build ShortsBot APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ShortsBot.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract app project
        run: unzip -q ShortsBot.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ShortsBot
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShortsBot-debug-apk
          path: ShortsBot/app/build/outputs/apk/debug/*.apk
          
